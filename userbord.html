<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteBuds User</title>

    <link rel="stylesheet" href="CSS/user.css">
</head>
<body>

    <nav>
        <div class="logo">TasteBuds</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Recipes</a></li>
            <li><a href="#">Favorites</a></li>
            <li><a href="#">About</a></li>
        </ul>

        <div class="user"></div>

        <button id="logoutBtn">
            Logout
        </button>
    </nav>

    <main class="container">

        <section class="welcome">
            <h1>Hoş Geldin 👋</h1>
            <p>Favori tariflerine hızlıca ulaşabilirsin.</p>
        </section>

        <section class="stats">

            <div class="card">
                <h2>❤️</h2>
                <span class="number">12</span>
                <p>Favori Tarif</p>
            </div>

            <div class="card">
                <h2>📝</h2>
                <span class="number">4</span>
                <p>Kayıtlı Yazı</p>
            </div>

            <div class="card">
                <h2>⭐</h2>
                <span class="number">28</span>
                <p>Etkileşim</p>
            </div>

        </section>

        <section class="section">

            <h2>Favorilerim</h2>

            <div class="recipe">
                <span>🍝 Tavuklu Makarna</span>
                <button class="remove-btn">Kaldır</button>
            </div>

            <div class="recipe">
                <span>🍰 Cheesecake</span>
                <button class="remove-btn">Kaldır</button>
            </div>

            <div class="recipe">
                <span>🥣 Mercimek Çorbası</span>
                <button class="remove-btn">Kaldır</button>
            </div>

        </section>

    </main>

    <footer>
        © 2026 TasteBuds. Tüm hakları saklıdır.
    </footer>

    <script src="JS/user.js"></script>

</body>
</html>
